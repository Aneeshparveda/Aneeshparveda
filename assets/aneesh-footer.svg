<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="aneesh-footer-title">
  <title id="aneesh-footer-title">If it is not measured, it is not claimed.</title>
  <defs>
    <linearGradient id="aneesh-footer-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#701A3D"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="120" fill="#10070C"/>
  <rect x="120" y="28" width="960" height="2" fill="url(#aneesh-footer-line)"/>
  <circle cx="600" cy="29" r="5" fill="#E5B5C7">
    <animate attributeName="opacity" values="1;0.25;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="78" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#F8F0F3">If it isn’t measured, it isn’t claimed.</text>
</svg>
