<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="rc-t rc-d">
<title id="rc-t">Recognition — evidence, on the record</title>
<desc id="rc-d">NEXUS-32 verification closure: PASS 15, FAIL 0, NOT_RUN 0. SoC START-to-verdict latency 129 cycles, LANES 32, simulation figure. iHub-Data Certificate of Competency for a 24-week AI and ML programme, September 2025 to February 2026.</desc>
<defs><linearGradient id="rc-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient><radialGradient id="rc-glow" cx="82%" cy="20%" r="65%"><stop offset="0" stop-color="#701A3D" stop-opacity=".65"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient><pattern id="rc-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/></pattern></defs>
<rect width="1200" height="380" rx="18" fill="url(#rc-bg)"/>
<rect width="1200" height="380" rx="18" fill="url(#rc-glow)"/>
<rect width="1200" height="380" rx="18" fill="url(#rc-grid)"/>
<rect x="1" y="1" width="1198" height="378" rx="17" fill="none" stroke="#701A3D" stroke-opacity=".55"/>
<rect x="40" y="40" width="360" height="300" rx="14" fill="#10070C" stroke="#701A3D"/>
<text x="64" y="80" font-size="16" fill="#C77B9B" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-weight="bold" text-anchor="start" letter-spacing="1">VERIFICATION CLOSURE</text>
<text x="64" y="140" font-size="30" fill="#F8F0F3" font-family='Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif' font-weight="bold" text-anchor="start">NEXUS-32</text>
<text x="64" y="180" font-size="20" fill="#E5B5C7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-weight="normal" text-anchor="start">PASS 15 · FAIL 0 · NOT_RUN 0</text>
<text x="64" y="220" font-size="18" fill="#B6A3AC" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-weight="normal" text-anchor="start">Simulation + CI,</text>
<text x="64" y="246" font-size="18" fill="#B6A3AC" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-weight="normal" text-anchor="start">differential vs golden model.</text>
<rect x="420" y="40" width="360" height="300" rx="14" fill="#10070C" stroke="#701A3D"/>
<text x="444" y="80" font-size="16" fill="#C77B9B" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-weight="bold" text-anchor="start" letter-spacing="1">SoC LATENCY</text>
<text x="444" y="140" font-size="30" fill="#F8F0F3" font-family='Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif' font-weight="bold" text-anchor="start">129 cycles</text>
<text x="444" y="180" font-size="20" fill="#E5B5C7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-weight="normal" text-anchor="start">START-to-verdict, LANES = 32</text>
<text x="444" y="220" font-size="18" fill="#B6A3AC" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-weight="normal" text-anchor="start">Simulation figure.</text>
<text x="444" y="246" font-size="18" fill="#B6A3AC" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-weight="normal" text-anchor="start">Not a board measurement.</text>
<rect x="800" y="40" width="360" height="300" rx="14" fill="#10070C" stroke="#701A3D"/>
<text x="824" y="80" font-size="16" fill="#C77B9B" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-weight="bold" text-anchor="start" letter-spacing="1">CERTIFICATE</text>
<text x="824" y="140" font-size="30" fill="#F8F0F3" font-family='Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif' font-weight="bold" text-anchor="start">Certificate</text>
<text x="824" y="180" font-size="20" fill="#E5B5C7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-weight="normal" text-anchor="start">iHub-Data, IIIT Hyderabad</text>
<text x="824" y="220" font-size="18" fill="#B6A3AC" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-weight="normal" text-anchor="start">AI &amp; ML programme, 24 weeks,</text>
<text x="824" y="246" font-size="18" fill="#B6A3AC" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-weight="normal" text-anchor="start">Sep 2025 – Feb 2026.</text>
<text x="60" y="360" font-size="17" fill="#B6A3AC" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-weight="normal" text-anchor="start">No awards are claimed here. What is shown is evidence with its level labelled.</text>
<rect x="40" y="40" width="80" height="4" fill="#F8F0F3" opacity="0"><animate attributeName="x" values="40;320" dur="20s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="20s" begin="0s" repeatCount="indefinite"/></rect>
<rect x="420" y="40" width="80" height="4" fill="#F8F0F3" opacity="0"><animate attributeName="x" values="420;700" dur="20s" begin="6.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="20s" begin="6.7s" repeatCount="indefinite"/></rect>
<rect x="800" y="40" width="80" height="4" fill="#F8F0F3" opacity="0"><animate attributeName="x" values="800;1080" dur="20s" begin="13.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="20s" begin="13.3s" repeatCount="indefinite"/></rect>
</svg>
