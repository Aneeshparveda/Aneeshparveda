<text x="60" y="244" font-size="20" fill="#B6A3AC" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-weight="normal" text-anchor="start">The live graph is on my profile page, below this README.</text>
