<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="pc-t pc-d">
<title id="pc-t">CircuitMind</title>
<desc id="pc-d">Deterministic, offline PCB fault diagnosis — AI Domain X Challenge 2026, team Dragons.</desc>
<defs><linearGradient id="pc-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient><radialGradient id="pc-glow" cx="82%" cy="20%" r="65%"><stop offset="0" stop-color="#701A3D" stop-opacity=".65"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient><pattern id="pc-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/></pattern></defs>
<rect width="1200" height="370" rx="18" fill="url(#pc-bg)"/>
<rect width="1200" height="370" rx="18" fill="url(#pc-glow)"/>
<rect width="1200" height="370" rx="18" fill="url(#pc-grid)"/>
<rect x="1" y="1" width="1198" height="368" rx="17" fill="none" stroke="#701A3D" stroke-opacity=".55"/>
<text x="60" y="78" font-size="34" fill="#F8F0F3" font-family='Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif' font-weight="bold" text-anchor="start">CircuitMind</text>
<text x="60" y="122" font-size="21" fill="#E5B5C7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-weight="normal" text-anchor="start">Deterministic, offline PCB fault diagnosis — AI Domain X Challenge 2026, team Dragons.</text>
<text x="60" y="168" font-size="21" fill="#F8F0F3" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-weight="normal" text-anchor="start">Instance holdout top-1 88.0% · top-3 100% · reserve top-1 85.0% (committed validation).</text>
<text x="60" y="212" font-size="19" fill="#B6A3AC" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-weight="normal" text-anchor="start">Python · ML · PCB inspection · synthetic benchmarks</text>
<rect x="60" y="250" width="1080" height="64" rx="12" fill="#451126"/>
<text x="84" y="290" font-size="20" fill="#F8F0F3" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-weight="normal" text-anchor="start">STATUS  ·  Prototype; all benchmarks on synthetic data only</text>
<rect x="0" y="2" width="80" height="4" fill="#F8F0F3" opacity="0"><animate attributeName="x" values="0;1120" dur="30s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="30s" begin="0s" repeatCount="indefinite"/></rect>
<rect x="60" y="330" width="260" height="26" rx="13" fill="#451126" stroke="#C77B9B" opacity="0.25"><animate attributeName="opacity" values="0.25;1;0.25" keyTimes="0;0.25;0.5" dur="20s" begin="0s" repeatCount="indefinite"/></rect>
<rect x="330" y="330" width="260" height="26" rx="13" fill="#451126" stroke="#C77B9B" opacity="0.25"><animate attributeName="opacity" values="0.25;1;0.25" keyTimes="0;0.25;0.5" dur="20s" begin="5s" repeatCount="indefinite"/></rect>
<rect x="600" y="330" width="260" height="26" rx="13" fill="#451126" stroke="#C77B9B" opacity="0.25"><animate attributeName="opacity" values="0.25;1;0.25" keyTimes="0;0.25;0.5" dur="20s" begin="10s" repeatCount="indefinite"/></rect>
<rect x="870" y="330" width="260" height="26" rx="13" fill="#451126" stroke="#C77B9B" opacity="0.25"><animate attributeName="opacity" values="0.25;1;0.25" keyTimes="0;0.25;0.5" dur="20s" begin="15s" repeatCount="indefinite"/></rect>
